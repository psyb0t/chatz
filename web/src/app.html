<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chatz</title>
    <script>
      // Resolve the theme before first paint so there is no light/dark flash.
      // Saved preference wins; otherwise follow the OS. Mirrors theme.svelte.ts.
      try {
        var saved = localStorage.getItem("chatz-theme");
        var dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute(
          "data-theme",
          dark ? "dark" : "light",
        );
      } catch (e) {
        /* localStorage/matchMedia unavailable — fall back to the light default. */
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
