name: pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  code:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
      security-events: write # code-workflow declares it for the sec SARIF upload; a caller must grant at least what the reusable workflow requests or the run fails at startup
    uses: psyb0t/reusable-github-workflows/.github/workflows/code-workflow.yml@master
    with:
      lint_command: "make lint"
      # `make test-coverage` is the framework's Go coverage gate (writes
      # coverage-percent.txt). It runs the integration-tagged Go suite only, so
      # the web typecheck/unit tests and the api tier are chained after it.
      test_command: "make test-coverage && make web-check && make web-test && make test-api"
      # Full security scan (govulncheck + semgrep) merged into sec.sarif, run
      # inside the dev-image. Fails the job on any finding.
      sec_command: "make sec"
      # Runs all codegen then fails on a dirty tree. chatz commits gorm
      # repositories, the OpenAPI server/client and the embedded GenUI prompt,
      # so a hand-edit to a *.gen.go or an un-regenerated source change would
      # ship silently without this. `make generate` is idempotent, so any diff
      # is one of those two.
      generate_command: "make generate"
      coverage_file: "coverage-percent.txt"
      sarif_file: "sec.sarif"
      sarif_category: "go"

  docker:
    needs: [code]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: write
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/chatz
      target_platforms: "linux/amd64,linux/arm64"
      scan_severity: "high"
      scan_fail_build: false
      dockerhub_private: false
      sync_description: true
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  badges:
    needs: [code]
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
    with:
      coverage: true
