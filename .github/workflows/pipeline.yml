name: pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  go:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/go-workflow.yml@master
    with:
      go_version: "1.26.6"
      dep_command: "make dep"
      lint_command: "make lint"
      test_command: "make test-coverage"
      is_vendored: true
      coverage_file: "coverage-percent.txt"
      # Without this, a hand-edit to a *.gen.go survives until the next person
      # runs the generator, and a source change whose codegen was never re-run
      # ships silently. The shared workflow runs generate_command (default
      # `make generate`) and fails if the tree moved; `make generate` is
      # idempotent, so any diff is one of those two.
      #
      # It is off by default upstream because a repo that generates nothing has
      # no drift to check. chatz commits gorm repositories, the OpenAPI
      # server/client and the embedded GenUI prompt, so it needs the gate on.
      # (The elelem Driver mock used to be generated here too; it now lives in
      # the elelem repo and is generated there.)
      has_codegen: true

  docker:
    needs: [go]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: write
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/chatz
      target_platforms: "linux/amd64,linux/arm64"
      scan_severity: "high"
      scan_fail_build: false
      dockerhub_private: false
      sync_description: true
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  badges:
    needs: [go]
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
    with:
      coverage: true
