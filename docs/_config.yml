title: chatz
tagline: Self-hosted AI chat in one Docker image
description: A self-hosted AI chat app in one Go binary, with streaming OpenAI-compatible and Anthropic models, MCP tools, generative UI and Postgres or SQLite.
lang: en
url: https://psyb0t.github.io
baseurl: /chatz
repository: psyb0t/chatz
author: Ciprian Mandache

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: mocha

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-include-cache

permalink: pretty

# Local, gitignored notes that may sit in docs/ are not site pages.
exclude:
  - PLAN.md

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
      seo:
        type: TechArticle

search:
  heading_level: 3

aux_links:
  GitHub:
    - https://github.com/psyb0t/chatz
aux_links_new_tab: true

nav_external_links:
  - title: Changelog
    url: https://github.com/psyb0t/chatz/blob/main/CHANGELOG.md

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/psyb0t/chatz
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree
